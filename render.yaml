services:
  - type: web
    name: krishimarket-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://krishimarket-frontend.onrender.com,http://localhost:3000,http://localhost:3001

  - type: web
    name: krishimarket-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://krishimarket-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://krishimarket-frontend.onrender.com
